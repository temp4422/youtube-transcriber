# Standalone experiment: no web-app services, ports, cookies, or paid services.
name: youtube-transcriber-pot
services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    init: true
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4416/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  ytdlp-pot-probe:
    build:
      context: .
      target: ytdlp-pot-probe
    init: true
    mem_limit: 512m
    cpus: 1
    environment:
      POT_PROVIDER_URL: http://pot-provider:4416
      YTDLP_CLIENT: ${YTDLP_CLIENT:-mweb}
    depends_on:
      pot-provider:
        condition: service_healthy
