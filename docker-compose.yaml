name: youtube-transcriber
services:
  app:
    build:
      context: .
      target: prod
    init: true
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2
    restart: on-failure:10
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3005}:3000"
