name: youtube-transcriber
services:
  app:
    build:
      context: .
      target: prod
    restart: on-failure:10
    environment:
      CAPTION_BACKEND: ${CAPTION_BACKEND:-youtubejs}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3005}:3000"

  ytdlp-probe:
    profiles: [diagnostics]
    build:
      context: .
      target: ytdlp-probe
    init: true
    mem_limit: 512m
    cpus: 1
